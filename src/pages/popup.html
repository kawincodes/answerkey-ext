<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AnswerKey</title>
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="popup-header">
      <div class="brand">
        <img src="icons/icon-32.png" alt="">
        <span class="brand-name">AnswerKey</span>
      </div>
      <button id="open-settings" class="icon" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </header>

    <section id="setup" class="setup" hidden>
      <p><strong>Add your Anthropic API key to start.</strong></p>
      <p class="hint">AnswerKey uses your own key, so answers are billed to your Anthropic account.</p>
      <button id="setup-key" class="primary" type="button">Set up API key</button>
    </section>

    <section id="ready" hidden>
      <form id="ask-form" class="ask">
        <label for="question" class="visually-hidden">Question</label>
        <textarea id="question" rows="3" placeholder="Ask Claude anything…"></textarea>
        <div class="row">
          <span id="model-line" class="hint grow"></span>
          <button id="ask" class="primary" type="submit" disabled>Ask</button>
        </div>
      </form>

      <div class="toggles">
        <label class="switch">
          <input id="show-button" type="checkbox">
          <span class="track" aria-hidden="true"></span>
          <span class="text"><strong>“Ask Claude” button on selection</strong></span>
        </label>
        <label id="site-row" class="switch">
          <input id="site-enabled" type="checkbox">
          <span class="track" aria-hidden="true"></span>
          <span class="text"><strong>Show it on <span id="site-name"></span></strong></span>
        </label>
      </div>

      <p class="tip hint">Select text on a page, then click <strong>Ask Claude</strong>, right-click and choose
        <strong>Ask Claude</strong>, or press <span id="shortcut-keys"></span>.</p>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
