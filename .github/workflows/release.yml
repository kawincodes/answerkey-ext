# Publishes AnswerKey as a GitHub release with an installable zip.
#
# Set a new "version" in package.json, then do any one of these:
#   - push that change to the default branch (released automatically), or
#   - push a matching tag:   git tag v1.0.1 && git push origin v1.0.1
#   - or Actions tab → Release → Run workflow
# A version that already has a release is skipped, so other edits to
# package.json never publish anything.
#
# The release job type-checks, builds the zip, runs the end-to-end test against
# the unpacked zip (exactly what users install), then publishes the zip, its
# SHA-256 checksum and the install instructions from .github/release-notes.md.

name: Release

on:
  push:
    branches: ['**']
    paths: ['package.json'] # branch pushes only; tag pushes always run
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for an unreleased version
    # Branch pushes release only from the default branch.
    if: github.event_name != 'push' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare package.json with existing releases
        id: version
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in package.json ($tag). Update package.json, then tag that commit."
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::$tag is already released. Set a new version in package.json to publish another release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commit an existing tag points at (annotated tags are peeled).
          tagged=$(git ls-remote origin "refs/tags/$tag^{}" | cut -f1)
          [ -n "$tagged" ] || tagged=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $tag already points at another commit ($tagged). Set a new version in package.json."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build, test and publish
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build the extension zip
        run: npm run zip

      - name: Unpack the zip the way users will
        run: unzip -q "answerkey-edge-$TAG.zip" -d unpacked

      - name: Install Playwright's Chromium for the end-to-end test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: End-to-end test against the unpacked zip
        run: node tests/e2e.cjs unpacked

      - name: Publish the release
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          sha256sum "answerkey-edge-$TAG.zip" > SHA256SUMS.txt
          sed -e "s|{{VERSION}}|$TAG|g" -e "s|{{REPO_URL}}|$REPO_URL|g" .github/release-notes.md > release-notes.md
          gh release create "$TAG" "answerkey-edge-$TAG.zip" SHA256SUMS.txt \
            --title "AnswerKey $TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "$GITHUB_SHA"
